name: SynthPulse Pi n8n
on:
  workflow_dispatch:
  push:
    branches: [synthpulse-pi]
permissions:
  contents: write
concurrency:
  group: synthpulse-pi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
      - name: Build application from own source
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile > install.log 2>&1 || { tail -80 install.log; exit 1; }
          pnpm build:n8n > build.log 2>&1 || { tail -100 build.log; exit 1; }
      - name: Build own n8n with Synthwave provider catalogue
        run: docker build -f packaging/pi/Dockerfile -t synthpulse-n8n-pi:${GITHUB_SHA} .
      - name: Validate and archive
        run: |
          test "$(docker image inspect synthpulse-n8n-pi:${GITHUB_SHA} --format '{{.Architecture}}')" = arm64
          mkdir -p pi-release
          docker save synthpulse-n8n-pi:${GITHUB_SHA} | gzip > pi-release/synthpulse-n8n-arm64.tar.gz
          python3 - <<'BUILD'
          import json,os,pathlib,hashlib
          p=pathlib.Path('pi-release');f=p/'synthpulse-n8n-arm64.tar.gz';h=hashlib.file_digest(f.open('rb'),'sha256').hexdigest()
          data={'repository':os.environ['GITHUB_REPOSITORY'],'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'architecture':'arm64','hardware_tested':False,'image':'synthpulse-n8n-pi:'+os.environ['GITHUB_SHA'],'sha256':{f.name:h}}
          (p/'provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          (p/'SHA256SUMS').write_text(h+'  '+f.name+'\n')
          BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: synthpulse-n8n-pi
          path: pi-release/
      - name: Publish own prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" "synthpulse-pi-${GITHUB_RUN_NUMBER}" pi-release/* --target "$GITHUB_SHA" --prerelease --title "SynthPulse n8n - Raspberry Pi" --notes "ARM64 image built from our customised n8n fork. No production credentials or state. Account onboarding and physical Pi test pending."
